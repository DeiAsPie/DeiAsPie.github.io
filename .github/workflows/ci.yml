name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-audit:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install tools via mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true

      - name: Install Node dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build site (production)
        run: npm run build

      - name: Enforce CSS size budget
        run: node scripts/check_css_size.js

      - name: Check image quality budgets
        run: npm run size:images:check

      - name: Lint content quality
        run: npm run lint:content

      - name: Lint markdown
        run: npm run lint:markdown

      - name: Lint JavaScript
        run: npm run lint

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run tests
        run: pytest -q

      # Playwright manages its own server for the smoke tests. The audit step
      # below serves public/ itself, because Lighthouse and axe run against the
      # built output rather than a Hugo dev server.
      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run Playwright smoke tests
        run: npm run test:smoke

      # Same script the pre-push hook runs. run_lighthouse.mjs passes
      # --no-sandbox, which is what the runner images require.
      - name: Run Lighthouse and axe audits
        run: sh scripts/audit.sh

      - name: Upload build artifact (public)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-public
          path: public/

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
