name: CI

on:
  push:
  pull_request:

jobs:
  build-test-audit:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22.x]
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Node dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build site (production)
        run: npm run build

      - name: Enforce CSS size budget
        run: node scripts/check_css_size.js

      - name: Check image quality budgets
        run: npm run size:images:check

      - name: Lint content quality
        run: npm run lint:content

      - name: Lint markdown
        run: npm run lint:markdown

      - name: Lint JavaScript
        run: npm run lint

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run tests
        run: pytest -q

      # Lighthouse and axe run in the .husky/pre-push hook, not here. They need
      # a real browser, and the runner images disable unprivileged user
      # namespaces, so Chrome aborts with "No usable sandbox!". Playwright
      # manages its own server, so no manual http-server is needed.
      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run Playwright smoke tests
        run: npm run test:smoke

      - name: Upload build artifact (public)
        uses: actions/upload-artifact@v4
        with:
          name: site-public
          path: public/

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
