<!doctype html>
<html lang="en" class="h-full">
  <head>
    {{ partial "head.html" . }}
  </head>

  <body class="min-h-full">
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:fixed focus:z-50 focus:m-4 focus:px-4 focus:py-3 skip-link"
      >Skip to main content</a
    >
    {{ partial "header.html" . }}
    <div class="mx-auto max-w-3xl px-4 sm:px-6 lg:max-w-6xl">
      <main id="main" class="py-10">{{ block "main" . }}{{ end }}</main>
    </div>
    {{ partialCached "footer.html" . "global" }}
    {{ partial "script" (dict "path" "js/init-ui.js" "defer" true) }}
  </body>
</html>
