<footer
  class="py-10 border-t text-sm text-secondary border-subtle"
>
  <div class="mx-auto max-w-3xl px-4 sm:px-6 lg:max-w-6xl">
    <div class="flex items-center justify-between py-4">
    <p>© {{ now.Year }} {{ .Site.Params.author }}. All rights reserved.</p>
    <div class="flex items-center gap-4">
      <a class="nav-link" href="{{ .Site.BaseURL }}index.xml">RSS</a>
      {{ $labels := dict "signal" "Signal" "github" "GitHub" "linkedin"
      "LinkedIn" }} {{ range $name, $url := .Site.Params.social }}
      <a
        class="nav-link"
        href="{{ $url }}"
        target="_blank"
        rel="noopener noreferrer"
        >{{ index $labels $name | default ($name | humanize) }}</a
      >
      {{ end }}
    </div>
  </div>
  </div>
</footer>
