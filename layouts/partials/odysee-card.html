{{/* Partial: odysee-card.html Renders a single Odysee teaser item passed as a
dict: dict "title" ... "link" ... "pubDate" ... "thumbnail" ... "channel" ...
*/}}
<article class="card activatable">
  <a
    href="{{ .link }}"
    class="card-link"
    target="_blank"
    rel="noopener noreferrer"
  >
    <div
      class="card-media aspect-video overflow-hidden bg-card-shade"
    >
      {{ if .thumbnail }}
      <img
        src="{{ .thumbnail }}"
        alt=""
        aria-hidden="true"
        width="640"
        height="360"
        class="w-full h-full object-cover"
        loading="lazy"
      />
      {{ else }}
      <div
        class="flex items-center justify-center w-full h-full text-tertiary"
      >
        <svg
          class="w-8 h-8"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
      </div>
      {{ end }}
    </div>
    <div class="card-body flex flex-col justify-between flex-1">
      <div>
        <h3 class="card-title line-clamp-2">{{ .title }}</h3>
      </div>
      <div
        class="mt-3 flex items-center justify-between text-xs text-tertiary"
      >
        <span>{{ .pubDate.Format "Jan 2, 2006" }}</span>
        <span
          class="inline-flex items-center gap-1 font-medium text-secondary"
        >
          on Odysee
          <svg
            class="w-3.5 h-3.5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
            />
          </svg>
        </span>
      </div>
    </div>
  </a>
</article>
