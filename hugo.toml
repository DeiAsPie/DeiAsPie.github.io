baseURL = "https://deiaspie.github.io/"
title = "DeiAsPie - Privacy & Security Recommendations"
locale = "en-us"
summaryLength = 24
enableRobotsTXT = true
cleanDestinationDir = true
canonifyURLs = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
    # Set to false for better security - only enable if you need raw HTML in markdown
    # If raw HTML is needed, use shortcodes instead for better control
    unsafe = false
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
      # Enable block-level attributes for better accessibility control
      block = true
      title = true

[taxonomies]
category = "categories"
tag = "tags"

[outputs]
home = ["HTML", "RSS"]
section = ["HTML", "RSS"]
taxonomy = ["HTML"]
term = ["HTML"]

[params]
description = "Curated privacy-focused tools and services for digital sovereignty. Your guide to escaping surveillance capitalism."
author = "DeiAsPie"
prefetch = ["/recommendations/", "/recommendations/courses/"]

[params.odysee]
channels = ["@DeiAsPieBlog:f", "@DeiAsPie:1", "@DeiAsPieMindSpace:7"]

[params.social]
signal = "https://signal.me/#eu/wnMYTNtNQ3FetbthOQzkOGQKtqWJU5Bb5LHHmmhdo3-i9Ts59hlI1pxu1pZGr2rN"
github = "https://github.com/DeiAsPie"
linkedin = "https://linkedin.com/in/DeiAsPie"

[imaging]
# Optimize image processing - Hugo best practices
anchor = 'Smart'
bgColor = '#ffffff'
hint = 'photo'
quality = 85
resampleFilter = 'lanczos'

[build]
  # Build options for better performance and security
  buildStats = { enable = true }
  # Cache digest files for better cache control
  cacheBusters = [{ source = "assets/.*\\.js$", target = "js" }, { source = "assets/.*\\.css$", target = "css" }]

[security]
  # Hugo security configuration - following best practices
  enableInlineShortcodes = false
  [security.exec]
    # Only allow specific binaries if needed
    allow = ['^npx$']
    osEnv = ['^HUGO_', '^CI$']
  [security.funcs]
    getenv = ['^HUGO_', '^CI$']
  [security.http]
    # Allow specific domains for resources.GetRemote
    methods = ['GET', 'HEAD']
    urls = ['^https://odysee\.com/.*$']

[caches]
  [caches.images]
  maxAge = "720h"

[minify]
minifyOutput = true

[pagination]
pagerSize = 12

[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "All"
url = "/recommendations/"
weight = 2

[[menu.main]]
name = "Courses"
url = "/recommendations/courses/"
weight = 3

[[menu.main]]
name = "Categories"
url = "/categories/"
weight = 4

[[menu.main]]
name = "Tags"
url = "/tags/"
weight = 5

[[menu.main]]
name = "About"
url = "/about/"
weight = 6
